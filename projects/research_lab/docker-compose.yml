version: "3.8"

services:
  research-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./reports:/app/reports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  research-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8502:8502"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    command: ["streamlit", "run", "dashboard.py", "--server.port=8502", "--server.headless=true"]
    volumes:
      - ./reports:/app/reports
    depends_on:
      - research-api
    restart: unless-stopped
